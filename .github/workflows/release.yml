name: Release

# Pushing a tag such as v0.2.0 publishes a stable release; v0.2.0-preview.1 publishes a prerelease.
# The tag's base version must match MARKETING_VERSION in the Xcode project.
on:
  push:
    tags: ["v*", "!v*-nightly.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag and main ancestry
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(Scripts/release-version.sh "$TAG")"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          commit="$(git rev-parse 'HEAD^{commit}')"
          test "$(git rev-parse "$TAG^{commit}")" = "$commit"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already merged into main." >&2
            exit 1
          fi
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"
      - name: Check formatting and run tests
        run: Scripts/check.sh

  dmg:
    name: Build release DMG
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/xcode-setup
      - name: Build and verify DMG
        id: package
        env:
          AMANUENSIS_VERSION: ${{ needs.checks.outputs.version }}
          AMANUENSIS_BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/package-dmg.sh
      - name: Check in-app updater against the DMG
        run: Scripts/check-updater.sh artifacts/Amanuensis.app "${{ steps.package.outputs.dmg-path }}"
      - name: Sign DMG for the in-app updater
        env:
          AMANUENSIS_UPDATE_PRIVATE_KEY: ${{ secrets.AMANUENSIS_UPDATE_PRIVATE_KEY }}
          DMG: ${{ steps.package.outputs.dmg-path }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: Scripts/sign-update.sh artifacts/Amanuensis.app "$DMG" "$VERSION"
      - name: Upload signed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release
          path: |
            ${{ steps.package.outputs.dmg-path }}
            ${{ steps.package.outputs.dmg-path }}.sig
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [checks, dmg]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release
          path: artifacts
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.checks.outputs.version }}
          COMMIT_SHA: ${{ needs.checks.outputs.commit }}
        run: Scripts/publish-release.sh "$TAG" "$COMMIT_SHA" "artifacts/Amanuensis-$VERSION-arm64.dmg"
