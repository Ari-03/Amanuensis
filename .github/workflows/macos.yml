name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check formatting and run tests
        run: Scripts/check.sh

  dmg:
    name: Build DMG
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify build tools
        id: tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun swift --version
          cmake --version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
          xcode_version="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
          printf 'cache-prefix=%s-%s-%s\n' "$(uname -m)" "$ImageVersion" "$xcode_version" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: DerivedData
          key: release-v1-${{ steps.tools.outputs.cache-prefix }}-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'Amanuensis.xcodeproj/project.pbxproj', 'BuildSupport/S1Mini/build.sh', 'BuildSupport/S1Mini/CMakeLists.txt', 'Scripts/build.sh') }}-${{ github.sha }}
          restore-keys: |
            release-v1-${{ steps.tools.outputs.cache-prefix }}-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'Amanuensis.xcodeproj/project.pbxproj', 'BuildSupport/S1Mini/build.sh', 'BuildSupport/S1Mini/CMakeLists.txt', 'Scripts/build.sh') }}-
            release-v1-${{ steps.tools.outputs.cache-prefix }}-
      - name: Build and verify DMG
        id: package
        run: Scripts/package-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.package.outputs.dmg-path }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30
