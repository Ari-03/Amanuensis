name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check formatting and run tests
        run: Scripts/check.sh

  dmg:
    name: Build DMG
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/xcode-setup
      - name: Build and verify DMG
        id: package
        run: Scripts/package-dmg.sh
      - name: Check in-app updater against the DMG
        run: Scripts/check-updater.sh artifacts/Amanuensis.app "${{ steps.package.outputs.dmg-path }}"
      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.package.outputs.dmg-path }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30
