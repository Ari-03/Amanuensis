name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check formatting and run tests
        run: Scripts/check.sh

  dmg:
    name: Build DMG
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun swift --version
          cmake --version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Build and verify DMG
        run: Scripts/package-dmg.sh
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Amanuensis-arm64-${{ github.sha }}
          path: |
            artifacts/*.dmg
            artifacts/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
